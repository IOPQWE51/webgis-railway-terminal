name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: Lint（全仓零错误门槛）
        run: npx eslint .

      - name: 单元测试（vitest）
        run: npm test

      - name: 生产构建
        run: npm run build
